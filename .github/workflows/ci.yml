name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and integration tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Fast end-to-end pipeline (22k synthetic patients)
        run: PYTHONPATH=src python -m readmit.pipeline all --fast
      - name: App smoke test
        run: PYTHONPATH=src python -m pytest -q tests/test_app_and_artifacts.py
